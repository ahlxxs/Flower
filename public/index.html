<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봉인의 제단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0d16; --panel: #1a1724; --line: #2f2a3d; --text: #ece6d8; --dim: #9a91a8;
    --gold: #d9b45a; --crimson: #b8323f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font-family: 'Gowun Batang', serif; color: var(--text); background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, #3a2a1255, transparent 50%),
      radial-gradient(circle at 80% 100%, #4a101a66, transparent 50%);
  }
  main { width: 100%; max-width: 420px; }
  h1 { text-align: center; font-size: 2.2rem; margin: 0; letter-spacing: .1em; color: var(--gold);
       text-shadow: 0 0 18px #d9b45a55; }
  .sub { text-align: center; color: var(--dim); margin: 6px 0 28px; }
  .sub b { color: var(--gold); font-weight: 400; } .sub i { color: var(--crimson); font-style: normal; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { display: block; font-size: .85rem; color: var(--dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px; font: inherit; font-size: 1rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button {
    width: 100%; padding: 12px; font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--gold); background: var(--gold); color: #1a1408;
  }
  button.ghost { background: transparent; color: var(--gold); }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .gap { height: 14px; }
  .or { text-align: center; color: var(--dim); margin: 16px 0; font-size: .85rem; }
  .err { color: #ff7b86; min-height: 1.4em; text-align: center; margin-top: 10px; font-size: .9rem; }
  .code { text-align: center; font-size: 2.4rem; letter-spacing: .3em; color: var(--gold); margin: 4px 0 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  li:last-child { border: 0; }
  .tag { font-size: .8rem; color: var(--gold); }
  .me { color: var(--dim); font-size: .8rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>봉인의 제단</h1>
  <p class="sub"><b>용사 파티</b> 와 <i>마왕군</i>, 누가 누구인가</p>

  <!-- 홈 -->
  <section id="home" class="card">
    <label for="name">닉네임</label>
    <input id="name" maxlength="12" autocomplete="nickname" placeholder="모험가 이름">
    <div class="gap"></div>
    <button id="create">방 만들기</button>
    <div class="or">또는 초대 코드로 입장</div>
    <div class="row">
      <input id="code" maxlength="5" placeholder="코드 5자리" aria-label="초대 코드" style="text-transform:uppercase">
      <button id="join" class="ghost" style="flex:0 0 96px">입장</button>
    </div>
  </section>

  <!-- 대기실 -->
  <section id="lobby" class="card" hidden>
    <label>초대 코드</label>
    <div class="code" id="roomCode"></div>
    <div class="row">
      <button id="invite">초대 링크 보내기</button>
    </div>
    <div class="gap"></div>
    <label id="count"></label>
    <ul id="players"></ul>
    <div class="gap"></div>
    <button id="leave" class="ghost">나가기</button>
  </section>

  <p class="err" id="err" role="alert"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const ws = new WebSocket(location.origin.replace(/^http/, 'ws'));
const send = msg => ws.send(JSON.stringify({ ...msg, name: $('name').value }));
let roomCode = null;

try { $('name').value = localStorage.getItem('name') || ''; } catch {}
$('code').value = new URLSearchParams(location.search).get('room') || '';

function go(type) {
  try { localStorage.setItem('name', $('name').value); } catch {}
  $('err').textContent = '';
  send({ type, code: $('code').value });
}
$('create').onclick = () => go('create');
$('join').onclick = () => go('join');
$('code').onkeydown = e => e.key === 'Enter' && go('join');
$('leave').onclick = () => send({ type: 'leave' });

$('invite').onclick = async () => {
  const url = `${location.origin}/?room=${roomCode}`;
  const text = `봉인의 제단에 초대합니다! 코드: ${roomCode}`;
  if (navigator.share) return navigator.share({ title: '봉인의 제단', text, url }).catch(() => {});
  await navigator.clipboard.writeText(`${text}\n${url}`);
  $('invite').textContent = '링크 복사됨!';
  setTimeout(() => $('invite').textContent = '초대 링크 보내기', 1500);
};

function show(lobby) {
  $('home').hidden = lobby;
  $('lobby').hidden = !lobby;
  history.replaceState(null, '', lobby ? `/?room=${roomCode}` : '/');
}

ws.onmessage = e => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'error') $('err').textContent = msg.message;
  if (msg.type === 'left') { roomCode = null; show(false); }
  if (msg.type === 'room') {
    roomCode = msg.code;
    $('roomCode').textContent = msg.code;
    $('count').textContent = `참가자 ${msg.players.length}명`;
    $('players').replaceChildren(...msg.players.map(p => {
      const li = document.createElement('li');
      const n = li.appendChild(document.createElement('span'));
      n.textContent = p.name;
      if (p.id === msg.you) n.insertAdjacentHTML('beforeend', ' <span class="me">(나)</span>');
      if (p.host) li.insertAdjacentHTML('beforeend', '<span class="tag">방장</span>');
      return li;
    }));
    show(true);
  }
};
ws.onclose = () => $('err').textContent = '서버와 연결이 끊어졌습니다. 새로고침 해주세요.';
</script>
</body>
</html>
