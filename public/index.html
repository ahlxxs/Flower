<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARCANA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500&family=Playfair+Display:wght@400;500&display=swap">
<style>
html, body { height: 100%; margin: 0; }
body { overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

/* 레이아웃: 웹 랜딩 형식. 액자처럼 띄운 숲 장면 + 상단 내비 + 왼쪽 아래 초대형 제목 */
:root {
  color-scheme: dark;
  --void: #070c0a; --leaf: #183329; --fog: #dfe9e2; --text: #f3f6f2; --amber: #e8c27a; --dim: #a9b8ae;
  --sans: 'Noto Sans KR', system-ui, sans-serif; --didone: 'Playfair Display', 'Bodoni 72', Didot, serif;
  --ld-bg: #070c0a; --ld-fg: #f3f6f2; --ld-dim: #8a9a90; --ld-accent: #e8c27a; --ld-card: #10201a; --ld-heart: #e8c27a; --ld-font: 'Noto Sans KR', sans-serif;
}
body {
  font-family: var(--sans); color: var(--text); display: grid; grid-template-rows: 1fr auto; place-items: center;
  background: radial-gradient(ellipse at 70% 0%, #2a463a, transparent 60%), linear-gradient(#18271f, var(--void));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.frame {
  position: relative; width: min(1200px, 100%); height: min(640px, 100%); overflow: hidden; border-radius: 4px;
  box-shadow: 0 30px 80px #000c; display: grid; grid-template-rows: auto 1fr auto; isolation: isolate;
}
.frame > svg, .frame > canvas, .rays { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.rays {
  background: linear-gradient(105deg, transparent 22%, #fff6d01f 26%, transparent 33%), linear-gradient(98deg, transparent 30%, #fff6d033 33%, transparent 38%);
  mix-blend-mode: screen; filter: blur(8px);
}
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px clamp(18px, 4vw, 44px); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--didone); font-weight: 500; font-size: 1.1rem; letter-spacing: .28em; }
header nav { display: flex; gap: clamp(14px, 3vw, 36px); }
.mi { border: 0; background: none; cursor: pointer; padding: 6px 0; font-weight: 300; font-size: .95rem; color: var(--text); position: relative; }
.mi::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--amber); scale: 0 1; transition: scale .25s; }
.mi:hover::after, .mi:focus-visible::after { scale: 1 1; } .mi:focus-visible { outline: none; }
.hero { align-self: end; padding: 0 clamp(18px, 4vw, 44px); }
.hero h1 { margin: 0 0 0 -2%; width: clamp(280px, 60vw, 720px); line-height: 0; filter: drop-shadow(0 4px 24px #000a); }
.hero h1 svg { width: 100%; height: auto; overflow: visible; }
.word { font-family: var(--didone); font-weight: 500; font-size: 190px; letter-spacing: -4px; fill: var(--text); }
.orbit { fill: var(--text); } .orbit-back { fill: none; stroke: var(--text); stroke-width: 2.5; opacity: .8; }
.spark { fill: var(--amber); }
.hero .sub { margin: 4px 0 0; font-size: .8rem; letter-spacing: .5em; color: var(--amber); font-weight: 500; }
.hero p { margin: 14px 0 0; max-width: 26em; font-weight: 300; font-size: .9rem; line-height: 1.7; color: var(--fog); }
.foot { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 22px clamp(18px, 4vw, 44px) 26px; }
.cta { border: 1px solid var(--amber); background: var(--amber); color: #1b1407; border-radius: 30px; padding: 11px 26px; font-weight: 500; letter-spacing: .1em; cursor: pointer; }
.cta.mi::after { display: none; } .cta:hover, .cta:focus-visible { box-shadow: 0 0 24px #e8c27a88; }
.facts { display: flex; gap: clamp(14px, 3vw, 34px); margin: 0; padding: 0; list-style: none; }
.facts li { display: flex; align-items: center; gap: 9px; font-size: .72rem; line-height: 1.25; letter-spacing: .06em; }
.facts svg { width: 30px; height: 30px; flex: none; fill: none; stroke: var(--text); stroke-width: 1.4; }
.under { padding: 14px 0 18px; text-align: center; font-size: .72rem; color: var(--dim); line-height: 1.6; letter-spacing: .08em; }
.seal { transform-box: view-box; transform-origin: 660px 470px; animation: spin 90s linear infinite; }
.seal.rev { animation-direction: reverse; animation-duration: 140s; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { animation: pulse 5s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .4; } }
@media (max-width: 680px) {
  .hero h1 { width: 104%; }
  .facts { width: 100%; justify-content: space-between; }
  .frame { height: 100%; }
}

/* ---------- 로딩 화면 ---------- */
.ld {
  position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: 1fr auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--ld-bg); color: var(--ld-fg); font-family: var(--ld-font);
  transition: opacity .7s ease, visibility .7s; cursor: pointer;
}
.ld.done { opacity: 0; visibility: hidden; }
.ld-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
.ld-card {
  width: 58px; height: 84px; border-radius: 7px; display: grid; place-items: center;
  background: var(--ld-card); border: 1px solid var(--ld-accent);
  box-shadow: inset 0 0 0 4px var(--ld-card), inset 0 0 0 5px color-mix(in srgb, var(--ld-accent) 55%, transparent), 0 0 30px color-mix(in srgb, var(--ld-accent) 30%, transparent);
  animation: ld-flip 2.4s ease-in-out infinite;
}
.ld-card svg { width: 26px; fill: var(--ld-heart); }
@keyframes ld-flip { 0%, 30% { transform: perspective(400px) rotateY(0) } 70%, 100% { transform: perspective(400px) rotateY(360deg) } }
.ld-progress { width: min(280px, 70vw); display: grid; gap: 10px; }
.ld-bar { height: 2px; background: color-mix(in srgb, var(--ld-fg) 15%, transparent); overflow: hidden; border-radius: 2px; }
.ld-bar i { display: block; height: 100%; width: 0; background: var(--ld-accent); box-shadow: 0 0 10px var(--ld-accent); transition: width .3s ease; }
.ld-status { display: flex; justify-content: space-between; font-size: .8rem; letter-spacing: .12em; color: var(--ld-dim); }
.ld-status b { font-weight: 400; font-variant-numeric: tabular-nums; color: var(--ld-fg); }
.ld-tip { max-width: 34em; margin: 0 auto; text-align: center; display: grid; gap: 8px; min-height: 5.2em; align-content: start; }
.ld-tag {
  justify-self: center; font-size: .7rem; letter-spacing: .25em; padding: 3px 10px 3px 12px; border-radius: 20px;
  border: 1px solid color-mix(in srgb, var(--tag, var(--ld-accent)) 60%, transparent); color: var(--tag, var(--ld-accent));
}
.ld-tip p { margin: 0; font-size: clamp(.95rem, 2.6vw, 1.1rem); line-height: 1.6; text-wrap: balance; transition: opacity .35s; }
.ld-tip.fade p, .ld-tip.fade .ld-tag { opacity: 0; }
.ld-hint { text-align: center; font-size: .7rem; color: var(--ld-dim); letter-spacing: .15em; margin-top: 4px; }


.ld-divider { display: block; width: min(320px, 80vw); height: 28px; color: var(--amber); opacity: .8; margin: 0 auto 8px; }

/* ---------- 장식: 모서리 문양, 해와 달 구분선 ---------- */
.ornate { position: relative; }
.cn { position: absolute; width: 44px; height: 44px; color: var(--amber); opacity: .85; pointer-events: none; }
.cn.tl { top: 6px; left: 6px; } .cn.tr { top: 6px; right: 6px; scale: -1 1; }
.cn.bl { bottom: 6px; left: 6px; scale: 1 -1; } .cn.br { bottom: 6px; right: 6px; scale: -1 -1; }
.divider { display: block; width: min(340px, 100%); height: 30px; color: var(--amber); margin: 0 auto; }

/* ---------- 창 (방 만들기 / 입장) ---------- */
.glass {
  width: min(100%, 380px); padding: 34px 30px 26px; border-radius: 6px; color: var(--text);
  background: #0a1410e6; border: 1px solid #e8c27a33; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 20px 60px #000a;
}
dialog { margin: auto; }
dialog::backdrop { background: #0008; backdrop-filter: blur(2px); }
.glass h2 { margin: 0 0 4px; text-align: center; font-family: var(--didone); font-weight: 400; font-size: 1.35rem; letter-spacing: .08em; }
.glass .divider { margin-bottom: 18px; }
label { display: block; font-size: .78rem; color: var(--dim); margin: 0 0 6px; letter-spacing: .08em; }
.glass input {
  width: 100%; padding: 12px; margin-bottom: 14px; font-size: 1rem;
  background: #0006; border: 1px solid #e8c27a40; border-radius: 6px;
}
.glass input:focus { outline: 1px solid var(--amber); border-color: var(--amber); }
.btns { display: flex; gap: 8px; } .btns > * { flex: 1; }
.btn { padding: 11px 22px; border-radius: 30px; border: 1px solid var(--amber); background: var(--amber); color: #1b1407; font-weight: 500; letter-spacing: .08em; cursor: pointer; transition: box-shadow .2s, opacity .2s; }
.btn:hover:not(:disabled) { box-shadow: 0 0 24px #e8c27a77; }
.btn.ghost { background: transparent; color: var(--amber); }
.btn:disabled { opacity: .4; cursor: default; }
.err { color: #ff8f98; min-height: 1.3em; margin: 10px 0 0; text-align: center; font-size: .85rem; }

/* ---------- 화면 전환: 홈 / 대기실 / 게임 ---------- */
.frame:not([data-view="home"]) :is(.hero, .foot, header nav) { display: none; }
.screen { grid-row: 2 / 4; min-height: 0; overflow-y: auto; padding: 0 clamp(18px, 4vw, 44px) 26px; animation: rise .6s ease both; }
@keyframes rise { from { opacity: 0; translate: 0 14px; } }

/* 대기실 */
#lobby { display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }
.lobby-head { text-align: center; }
.lobby-head h2 { margin: 0; font-family: var(--didone); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: .12em; }
.status { margin: 4px 0 0; font-size: .85rem; color: var(--fog); letter-spacing: .04em; }
.lobby-body { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; min-height: 0; }
.room { padding: 30px 22px 24px; text-align: center; background: #0a1410b3; border: 1px solid #e8c27a26; border-radius: 6px; backdrop-filter: blur(8px); }
.code { font-family: var(--didone); font-size: 2.2rem; letter-spacing: .25em; padding-left: .25em; color: var(--amber); margin: 0 0 16px; }
.room .btn { width: 100%; }
.link { margin-top: 12px; border: 0; background: none; color: var(--dim); font-size: .82rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.seats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.seat {
  position: relative; aspect-ratio: 5 / 7; border-radius: 8px; padding: 12px 8px; display: grid; grid-template-rows: 1fr auto auto; justify-items: center; gap: 4px; text-align: center;
  background: linear-gradient(160deg, #13261dcc, #070d0bcc); border: 1px solid #e8c27a2e; transition: border-color .3s, box-shadow .3s;
}
.seat svg.heart { align-self: center; width: 34%; fill: none; stroke: var(--dim); stroke-width: 1.5; transition: fill .3s, stroke .3s; }
.seat .nm { font-weight: 500; font-size: .95rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .st { font-size: .72rem; letter-spacing: .12em; color: var(--dim); }
.seat .badge { position: absolute; top: 8px; left: 50%; translate: -50% 0; font-size: .66rem; letter-spacing: .15em; color: var(--amber); }
.seat.me { outline: 1px dashed #e8c27a66; outline-offset: 3px; }
.seat.ready { border-color: var(--amber); box-shadow: 0 0 22px #e8c27a40, inset 0 0 0 4px #070d0b, inset 0 0 0 5px #e8c27a55; }
.seat.ready svg.heart { fill: var(--amber); stroke: var(--amber); filter: drop-shadow(0 0 6px #e8c27a); }
.seat.ready .st { color: var(--amber); }
.seat.empty { cursor: pointer; border-style: dashed; color: var(--dim); align-content: center; grid-template-rows: none; font-size: .85rem; }
.seat.empty:hover { color: var(--amber); border-color: var(--amber); }
.lobby-foot { display: flex; justify-content: center; }
.lobby-foot .btn { min-width: 220px; padding: 13px 30px; font-size: 1.02rem; }

/* 게임 (자리 표시) */
#game { display: grid; place-items: center; }
#game .glass { text-align: center; width: min(100%, 440px); }
#game p { color: var(--fog); font-size: .9rem; line-height: 1.7; margin: 0 0 18px; }

@media (max-width: 680px) {
  .lobby-body { grid-template-columns: 1fr; }
  .seats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seat { padding: 10px 4px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="corner" viewBox="0 0 120 120" fill="none" stroke="currentColor">
    <path d="M4 120V20Q4 4 20 4H120" stroke-width="1.4"/>

      <path d="M180 13A7 7 0 0 0 180 27A9 9 0 0 1 180 13Z"/><path d="M220 13A7 7 0 0 1 220 27A9 9 0 0 0 220 13Z"/>
      <path d="M190 17l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1ZM210 17l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1Z" transform="translate(0 -1)"/>
      <circle cx="200" cy="20" r="5"/>

    <path d="M208.0 20.0L215.0 20.0M207.4 23.1L210.2 24.2M205.7 25.7L210.6 30.6M203.1 27.4L204.2 30.2M200.0 28.0L200.0 35.0M196.9 27.4L195.8 30.2M194.3 25.7L189.4 30.6M192.6 23.1L189.8 24.2M192.0 20.0L185.0 20.0M192.6 16.9L189.8 15.8M194.3 14.3L189.4 9.4M196.9 12.6L195.8 9.8M200.0 12.0L200.0 5.0M203.1 12.6L204.2 9.8M205.7 14.3L210.6 9.4M207.4 16.9L210.2 15.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
</svg>
<div class="frame" id="frame" data-view="home">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7a64"/><stop offset=".5" stop-color="#1f3a2e"/><stop offset="1" stop-color="#08110d"/></linearGradient>
      <radialGradient id="sun" cx=".3" cy="0" r=".6"><stop offset="0" stop-color="#fff2c4" stop-opacity=".7"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
      <radialGradient id="ember" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9a5a" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/></radialGradient>
      <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe6a0" stop-opacity=".35"/><stop offset=".6" stop-color="#e0505e" stop-opacity=".08"/><stop offset="1" stop-color="#e0505e" stop-opacity="0"/></radialGradient>
      <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter><filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>
    <rect width="1600" height="900" fill="url(#sky)"/><rect width="1600" height="900" fill="url(#sun)"/>
    <g fill="#2c4a3c" filter="url(#b6)" opacity=".8"><rect x="300" width="40" height="900"/><rect x="560" width="26" height="900"/><rect x="1180" width="50" height="900"/><rect x="1380" width="30" height="900"/></g>
    <g fill="#15281f" filter="url(#b2)"><path d="M820 900 C 860 600, 900 300, 940 0 H1040 C 1010 300, 1040 620, 1120 900 Z"/><rect x="160" width="60" height="900"/></g>
    <circle cx="980" cy="760" r="120" fill="url(#ember)"/>
    <circle cx="660" cy="470" r="300" fill="url(#halo)" class="pulse"/>
    <g fill="none" stroke="#f0cf7a" stroke-opacity=".5">
      <g class="seal">
        <circle cx="660" cy="470" r="240" stroke-width="1.5"/>
        <circle cx="660" cy="470" r="222" stroke-width=".8" stroke-dasharray="4 10"/>
        <polygon points="660,230 868,590 452,590" stroke-width="1"/>
        <polygon points="660,710 452,350 868,350" stroke-width="1"/>
      </g>
      <g class="seal rev">
        <circle cx="660" cy="470" r="160" stroke-width="1" stroke-dasharray="30 6 2 6"/>

    </g>
    <g fill="#060c09">
      <path d="M1600 0 H1300 C 1340 200, 1260 420, 1330 560 C 1380 660, 1500 700, 1600 720 Z"/>
      <path d="M0 0 H120 C 90 300, 140 560, 60 900 H0 Z"/>
      <path d="M1180 560 C 1240 600, 1300 640, 1420 650 C 1340 680, 1260 690, 1200 720 Z"/>
      <path d="M0 900 V820 Q500 760 900 800 T1600 790 V900 Z"/>
    </g>
    <g fill="none" stroke="#060c09" stroke-width="4"><path d="M1300 0 Q1200 160 1240 320"/><path d="M1380 0 Q1450 180 1400 340"/><path d="M120 0 Q220 140 180 260"/></g>
  </svg>
  <div class="rays" aria-hidden="true"></div>
  <canvas id="cv" aria-hidden="true"></canvas>
  <header>
    <div class="brand">ARCANA</div>
    <nav aria-label="메인 메뉴"><button class="mi" data-open="join">코드로 입장</button></nav>
  </header>
  <section class="hero">
    <h1 aria-label="ARCANA">
      <svg viewBox="0 0 1000 300" aria-hidden="true">
        <g transform="rotate(-7 500 160)"><path class="orbit-back" d="M40 168 A465 92 0 0 1 960 168"/></g>
        <line x1="503" y1="0" x2="503" y2="300" stroke="#f3f6f2" stroke-width="2.5"/>
        <text class="word" x="500" y="225" text-anchor="middle">ARCANA</text>
        <g transform="rotate(-7 500 160)">
          <path class="orbit" d="M28 168 A472 100 0 0 0 972 168 L958 162 A458 86 0 0 1 42 162 Z"/>
          <path class="orbit" d="M972 168 Q 1000 150 990 118 Q 996 152 958 162 Z"/>
          <path class="orbit" d="M28 168 Q 0 186 12 214 Q 4 182 42 162 Z"/>
        </g>
        <path class="spark" d="M503 112 L512 150 L548 159 L512 168 L503 206 L494 168 L458 159 L494 150 Z"/>
        <path class="spark" d="M908 50 L912 66 L928 70 L912 74 L908 90 L904 74 L888 70 L904 66 Z"/>
        <path class="spark" d="M96 248 L99 260 L111 263 L99 266 L96 278 L93 266 L81 263 L93 260 Z"/>
      </svg>
    </h1>
    <p class="sub">봉인의 제단</p>
    <p>용사 파티와 마왕군이 한 테이블에 앉습니다. 직업은 모두가 알지만, 진영은 나만 압니다.</p>
  </section>

  <section id="lobby" class="screen" hidden aria-label="대기실">
    <div class="lobby-head">
      <h2>대기실</h2>
      <svg class="divider"><use href="#divider"/></svg>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
    <div class="lobby-body">
      <aside class="room ornate">
        <svg class="cn tl"><use href="#corner"/></svg><svg class="cn tr"><use href="#corner"/></svg><svg class="cn bl"><use href="#corner"/></svg><svg class="cn br"><use href="#corner"/></svg>
        <label>초대 코드</label>
        <div class="code" id="roomCode"></div>
        <button id="invite" class="btn ghost" type="button">초대 링크 보내기</button>
        <button id="leave" class="link" type="button">방 나가기</button>
      </aside>
      <ul class="seats" id="seats" aria-label="참가자"></ul>
    </div>
    <div class="lobby-foot"><button id="action" class="btn" type="button"></button></div>
  </section>

  <section id="game" class="screen" hidden aria-label="게임">
    <div class="glass ornate">
      <svg class="cn tl"><use href="#corner"/></svg><svg class="cn tr"><use href="#corner"/></svg><svg class="cn bl"><use href="#corner"/></svg><svg class="cn br"><use href="#corner"/></svg>
      <h2>게임 시작</h2>
      <svg class="divider"><use href="#divider"/></svg>
      <p>모두 자리에 앉았습니다. 게임 화면은 다음 단계에서 만들어질 예정입니다.</p>
      <button class="btn ghost" type="button" id="leaveGame">나가기</button>
    </div>
  </section>

  <div class="foot">
    <button class="cta mi" data-open="create">방 만들기 →</button>
    <ul class="facts">
      <li><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13"/><circle cx="15" cy="12" r="4"/><path d="M8 23c2-4 12-4 14 0"/></svg>히든 롤<br>진영 비공개</li>
      <li><svg viewBox="0 0 30 30"><rect x="8" y="4" width="14" height="22" rx="2"/><path d="M15 19l-3.5-3.5a2.2 2.2 0 0 1 3.5-2.6 2.2 2.2 0 0 1 3.5 2.6Z"/></svg>손패가 곧<br>생명</li>
      <li><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13"/><path d="M15 4l9.5 16.5h-19Z"/></svg>봉인 의식<br>익명 헌납</li>
    </ul>
  </div>
</div>
<p class="under">ARCANA · 용사 파티와 마왕군 · v0.1</p>

<dialog id="dlg" class="glass ornate">
  <svg class="cn tl"><use href="#corner"/></svg><svg class="cn tr"><use href="#corner"/></svg><svg class="cn bl"><use href="#corner"/></svg><svg class="cn br"><use href="#corner"/></svg>
  <form id="form">
    <h2 id="dlgTitle"></h2>
    <svg class="divider"><use href="#divider"/></svg>
    <label for="name">닉네임</label>
    <input id="name" maxlength="12" autocomplete="nickname" placeholder="모험가 이름" required>
    <div id="codeRow">
      <label for="code">초대 코드</label>
      <input id="code" maxlength="5" placeholder="5자리" autocomplete="off" style="text-transform:uppercase">
    </div>
    <div class="btns">
      <button type="button" class="btn ghost" id="cancel">취소</button>
      <button class="btn">확인</button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </form>
</dialog>

<div class="ld" id="loader" role="status" aria-live="polite">
  <div class="ld-center">
    <div class="ld-card" aria-hidden="true"><svg viewBox="0 0 32 29"><path d="M16 29 2.6 15.6A8 8 0 0 1 16 4.3 8 8 0 0 1 29.4 15.6Z"/></svg></div>
    <div class="ld-progress">
      <div class="ld-bar"><i id="ldFill"></i></div>
      <div class="ld-status"><span id="ldStage">카드를 섞는 중</span><b id="ldPct">0%</b></div>
    </div>
  </div>
  <div>
    <svg class="ld-divider" aria-hidden="true"><use href="#divider"/></svg>
    <div class="ld-tip" id="ldTip"><span class="ld-tag" id="ldTag"></span><p id="ldText"></p></div>
    <div class="ld-hint">화면을 누르면 다음 팁</div>
  </div>
</div>

<template id="heart"><svg class="heart" viewBox="0 0 32 29" aria-hidden="true"><path d="M16 27 3.3 14.9A7.4 7.4 0 0 1 16 5.4 7.4 7.4 0 0 1 28.7 14.9Z"/></svg></template>
<script>
const $ = id => document.getElementById(id);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 로딩 화면: 처음 접속, 대기실 입장, 게임 시작 때 공통으로 쓴다 ---------- */
const TIPS = [
  ['주의', '공격을 막지 못하면 손패 한 장을 잃고, 손패가 0장이 되면 쓰러집니다.'],
  ['주의', '헌납은 매 라운드 의무이니, 끝까지 지킬 카드는 미리 정해 두세요.'],
  ['주의', '사용한 카드는 앞면으로 공개되어, 무엇을 썼는지 모두가 봅니다.'],
  ['주의', '거래에서는 원하는 카드를 말할 수 없으니, 뒷면 한 장에 믿음을 걸어야 합니다.'],
  ['마왕군', '봉인 카드가 제단에 목표 수만큼 모이는 순간, 마왕군이 즉시 승리합니다.'],
  ['마왕군', '제단의 카드는 섞인 뒤 공개되어, 누가 봉인 카드를 바쳤는지 아무도 모릅니다.'],
  ['마왕군', '마왕군은 용사 파티를 전멸시켜도 승리합니다.'],
  ['마왕군', '쓰러진 마왕군도 용사를 방해할 수 있지만, 봉인은 더 이상 도울 수 없습니다.'],
  ['카드', '카드 뒷면의 하트는 장식이 아니라 당신에게 남은 생명입니다.'],
  ['카드', '카드를 쓰면 바로 한 장을 뽑으므로, 카드를 써도 손패는 줄지 않습니다.'],
  ['카드', '피해로 잃은 카드는 뒷면으로 버려져, 그 내용은 끝까지 비밀입니다.'],
  ['카드', '덱이 바닥나면 버림 더미를 섞어 다시 덱으로 씁니다.'],
  ['TMI', '\'마왕\'이라는 직업은 없으니, 마왕군은 늘 평범한 얼굴로 섞여 있습니다.'],
  ['TMI', '직업은 모두에게 공개되지만, 진영은 오직 당신만 압니다.'],
  ['TMI', '헌납이 모두의 의무인 이유는 손패 수로 정체가 드러나지 않게 하기 위해서입니다.'],
  ['TMI', 'ARCANA는 \'비밀\'을 뜻하는 라틴어로, 타로 카드 묶음을 부르는 이름이기도 합니다.'],
];
const TAG_COLOR = { 주의: '#e8b04a', 마왕군: '#e0505e', 카드: '#7fc8e0', TMI: '#a99cf0' };
const STAGES = ['카드를 섞는 중', '제단을 세우는 중', '봉인진을 그리는 중', '용사들을 부르는 중'];


let tipIdx = Math.random() * TIPS.length | 0, tipTimer, loadTimer;
function showTip() {
  tipIdx = (tipIdx + 1) % TIPS.length;
  const [tag, text] = TIPS[tipIdx];
  $('ldTip').classList.add('fade');
  setTimeout(() => {
    $('ldTag').textContent = tag; $('ldTag').style.setProperty('--tag', TAG_COLOR[tag]);
    $('ldText').textContent = text; $('ldTip').classList.remove('fade');
  }, 300);
}
$('loader').onclick = showTip;

// 로딩을 띄우고, done()이 불리고 minMs가 지나면 then()을 실행한 뒤 사라진다
function loading(stages, minMs) {
  const t0 = Date.now();
  let pct = 0, ready = null;
  clearInterval(loadTimer); clearInterval(tipTimer);
  $('ldFill').style.width = '0%'; $('ldPct').textContent = '0%'; $('ldStage').textContent = stages[0];
  showTip(); tipTimer = setInterval(showTip, 3800);
  $('loader').classList.remove('done');
  loadTimer = setInterval(() => {
    const go = ready && Date.now() - t0 >= minMs;
    pct = go ? Math.min(100, pct + 10) : Math.min(90, pct + Math.random() * 4 + .5);
    $('ldFill').style.width = pct + '%';
    $('ldPct').textContent = Math.floor(pct) + '%';
    $('ldStage').textContent = stages[Math.min(stages.length - 1, pct / (100 / stages.length) | 0)];
    if (pct < 100) return;
    clearInterval(loadTimer); clearInterval(tipTimer);
    ready();
    setTimeout(() => $('loader').classList.add('done'), 250);
  }, 120);
  return {
    done: then => ready = then,
    fail: msg => { clearInterval(loadTimer); clearInterval(tipTimer); $('ldStage').textContent = msg; },
    cancel: () => { clearInterval(loadTimer); clearInterval(tipTimer); $('loader').classList.add('done'); },
  };
}

const invited = new URLSearchParams(location.search).get('room');
const ws = new WebSocket(location.origin.replace(/^http/, 'ws'));
let pending = loading(STAGES, 2800); // 처음 접속
Promise.all([
  new Promise((ok, fail) => { ws.addEventListener('open', ok); ws.addEventListener('error', fail); }),
  document.fonts.ready,
]).then(() => pending.done(() => {
  pending = null;
  if (invited) { $('code').value = invited; open('join'); }
}), () => pending.fail('서버에 연결하지 못했습니다. 새로고침 해주세요.'));

/* ---------- 화면 ---------- */
function view(name) {
  $('frame').dataset.view = name;
  $('lobby').hidden = name !== 'lobby';
  $('game').hidden = name !== 'game';
  history.replaceState(null, '', name === 'home' ? '/' : `/?room=${room.code}`);
}

/* ---------- 방 만들기 / 입장 ---------- */
const send = msg => ws.send(JSON.stringify({ ...msg, name: $('name').value }));
let mode = null, room = null;
try { $('name').value = localStorage.getItem('name') || ''; } catch {}

function open(m) {
  mode = m;
  $('dlgTitle').textContent = m === 'create' ? '방 만들기' : '코드로 입장';
  $('codeRow').hidden = m === 'create';
  $('code').required = m === 'join';
  $('dlg').showModal();
}
document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { $('err').textContent = ''; open(b.dataset.open); });
$('cancel').onclick = () => $('dlg').close();
$('form').onsubmit = e => {
  e.preventDefault();
  try { localStorage.setItem('name', $('name').value); } catch {}
  $('err').textContent = '';
  $('dlg').close();
  pending = loading(['대기실로 가는 중', '자리를 마련하는 중'], 1600);
  send({ type: mode, code: $('code').value });
};

/* ---------- 대기실 ---------- */
$('leave').onclick = $('leaveGame').onclick = () => send({ type: 'leave' });
$('invite').onclick = invite;
async function invite() {
  const url = `${location.origin}/?room=${room.code}`;
  const text = `ARCANA에 초대합니다! 코드: ${room.code}`;
  if (navigator.share) return navigator.share({ title: 'ARCANA', text, url }).catch(() => {});
  try { await navigator.clipboard.writeText(`${text}\n${url}`); } catch { return prompt('이 링크를 복사하세요', url); }
  $('invite').textContent = '복사됨!';
  setTimeout(() => $('invite').textContent = '초대 링크 보내기', 1500);
}
$('action').onclick = () => {
  if (meIn(room).host) send({ type: 'start' });
  else send({ type: 'ready', ready: !meIn(room).ready });
};
const meIn = r => r.players.find(p => p.id === r.you);

function renderLobby() {
  const me = meIn(room), others = room.players.filter(p => !p.host);
  const readyN = others.filter(p => p.ready).length;
  $('roomCode').textContent = room.code;
  $('seats').replaceChildren(...room.players.map(p => {
    const li = document.createElement('li');
    li.className = 'seat' + (p.ready || p.host ? ' ready' : '') + (p.id === room.you ? ' me' : '');
    li.append($('heart').content.cloneNode(true));
    if (p.host) li.insertAdjacentHTML('beforeend', '<span class="badge">방장</span>');
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name + (p.id === room.you ? ' (나)' : '');
    const st = document.createElement('span'); st.className = 'st'; st.textContent = p.host ? '방장' : p.ready ? '준비 완료' : '대기 중';
    li.append(nm, st);
    return li;
  }), Object.assign(document.createElement('li'), { className: 'seat empty', textContent: '+ 친구 초대', onclick: invite }));

  const short = room.minPlayers - room.players.length;
  $('status').textContent = short > 0 ? `${short}명이 더 들어오면 시작할 수 있습니다`
    : room.canStart ? (me.host ? '모두 준비되었습니다. 게임을 시작하세요!' : '모두 준비되었습니다. 방장이 시작하기를 기다리는 중')
    : `준비 완료 ${readyN} / ${others.length}`;
  $('action').textContent = me.host ? '게임 시작' : me.ready ? '준비 취소' : '준비하기';
  $('action').disabled = me.host && !room.canStart;
  $('action').classList.toggle('ghost', !me.host && me.ready);
}

ws.onmessage = e => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'error') {
    if (pending) { pending.cancel(); pending = null; open(mode); }
    $('err').textContent = msg.message;
    if (room) $('status').textContent = msg.message;
  }
  if (msg.type === 'left') { room = null; view('home'); }
  if (msg.type === 'room') {
    const entering = !room;
    room = msg;
    renderLobby();
    if (entering && pending) { const p = pending; pending = null; p.done(() => view('lobby')); }
    else if (entering) view('lobby');
  }
  if (msg.type === 'start') {
    pending = loading(['게임판을 펼치는 중', '카드를 나누는 중', '진영을 정하는 중'], 3200);
    const p = pending; pending = null; p.done(() => view('game'));
  }
};
ws.onclose = () => {
  $('err').textContent = '서버와 연결이 끊어졌습니다. 새로고침 해주세요.';
  if (room) $('status').textContent = $('err').textContent;
};

/* ---------- 배경 빛 입자 ---------- */
function canvasLoop(cv, setup, frame) {
  const g = cv.getContext('2d');
  let W, H, state;
  const resize = () => {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    state = setup(g, W, H);
    if (still) frame(g, W, H, state, 0);
  };
  addEventListener('resize', resize); resize();
  if (!still) { const tick = t => { frame(g, W, H, state, t); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
}
canvasLoop($('cv'), (g, W, H) => Array.from({ length: Math.round(W * H / 12000) }, () => ({
  x: Math.random() * W, y: Math.random() * H, r: .5 + Math.random() * 1.6, vy: -.1 - Math.random() * .25, p: Math.random() * 6, warm: Math.random() < .3,
})), (g, W, H, ms) => {
  g.clearRect(0, 0, W, H);
  for (const m of ms) {
    m.p += .02; m.y += m.vy; m.x += Math.sin(m.p) * .3; if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
    g.globalAlpha = .4 + Math.sin(m.p * 1.6) * .35; g.fillStyle = m.warm ? '#ffb27a' : '#f6f1d6';
    g.beginPath(); g.arc(m.x, m.y, m.r, 0, 7); g.fill();
  }
});
</script>
</body>
</html>
